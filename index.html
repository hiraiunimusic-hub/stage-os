</style></head><body><main class="shell"><header class="top"><div class="brand">GUITAR PERFORMANCE SYSTEM<strong>STAGE OS <span style="color:#71c8ff">/</span> LIVE</strong></div><div class="controls"><button class="btn edit-only" id="edit">メモを編集</button><button class="btn edit-only" id="start">ライブ開始</button><button class="btn" id="mode">ライブモード</button></div></header><section class="grid"><section class="panel"><div class="heading"><span id="track-count">SETLIST / 05 TRACKS</span></div><div id="songs"></div></section><section class="panel"><div class="meta"><div class="heading" style="margin:0">PERFORMANCE NOTES</div><div style="text-align:right"><div class="clock" id="clock">--:--:--</div><div class="elapsed" id="elapsed">LIVE 00:00:00</div></div></div><div class="notes" id="notes"></div></section></section><div class="foot">LOCAL FIRST · NO MICROPHONE · NO TRACK SWITCHING</div></main><div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="セトリとメモを編集"><div class="dialog"><h2 style="margin-top:0">曲名と演奏メモを編集</h2><p style="color:#9fbcd2;font-size:13px">メモはこのブラウザ内に保存されます。別端末には自動同期されません。</p><div id="fields"></div><div style="margin:12px 0"><button class="btn add-song" id="add-song" type="button">＋ 曲を追加</button></div><div class="actions"><button class="btn" id="cancel">キャンセル</button><button class="btn" id="export">設定を書き出す</button><button class="btn" id="import">設定を読み込む</button><input id="file" type="file" accept="application/json,.json" hidden><button class="btn" id="save" style="background:#125887">保存</button></div></div></div><script>
const defaults=Array.from({length:5},()=>({title:'',memo:''}));const key='stage-os-private-data-v1';let data;try{const stored=JSON.parse(localStorage.getItem(key));data=Array.isArray(stored)&&stored.length>0&&stored.every(x=>x&&typeof x.title==='string'&&typeof x.memo==='string')?stored:structuredClone(defaults)}catch{data=structuredClone(defaults)}const $=id=>document.getElementById(id);function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}function render(){ $('track-count').textContent=`SETLIST / ${String(data.length).padStart(2,'0')} TRACKS`; $('songs').replaceChildren();$('notes').replaceChildren();data.forEach((s,i)=>{let song=el('div','song');song.append(el('span','num',String(i+1).padStart(2,'0')),el('span','songname',s.title||'（未設定）'));$('songs').append(song);let note=el('div','note'+(!s.memo?' empty':''));note.append(el('div','n-title',`${String(i+1).padStart(2,'0')}  ${s.title||'（未設定）'}`),el('div','n-body',s.memo||'メモなし'));$('notes').append(note)})}render();let startAt=null;function tick(){const d=new Date();$('clock').textContent=d.toLocaleTimeString('ja-JP',{hour12:false});let n=startAt?Math.max(0,Math.floor((Date.now()-startAt)/1000)):0;$('elapsed').textContent='LIVE '+[Math.floor(n/3600),Math.floor(n%3600/60),n%60].map(x=>String(x).padStart(2,'0')).join(':')}tick();setInterval(tick,1000);$('start').onclick=()=>{startAt=Date.now();$('start').textContent='タイマー再開始'};$('mode').onclick=()=>{document.body.classList.toggle('live');$('mode').textContent=document.body.classList.contains('live')?'編集表示':'ライブモード'};function addEditorRow(s={title:'',memo:''}){const fields=$('fields');const i=fields.children.length;const row=el('div','editor');const a=el('div'),b=el('div');const la=el('label','',`曲 ${i+1}`),lb=el('label','','演奏メモ（改行OK）');const inp=el('input'),ta=el('textarea');inp.value=s.title;ta.value=s.memo;inp.className='song-input';ta.className='memo-input';const remove=el('button','btn remove-song','削除');remove.type='button';remove.onclick=()=>{if(fields.children.length<=1){alert('最低1曲は残してください');return}row.remove();[...fields.children].forEach((r,j)=>r.querySelector('label').textContent=`曲 ${j+1}`)};a.append(la,inp,remove);b.append(lb,ta);row.append(a,b);fields.append(row)}function showEditor(){const fields=$('fields');fields.replaceChildren();data.forEach(s=>addEditorRow(s));$('modal').classList.add('open')}$('add-song').onclick=()=>{addEditorRow();const d=$('dialog')||document.querySelector('.dialog');d.scrollTop=d.scrollHeight};$('edit').onclick=showEditor;$('cancel').onclick=()=>$('modal').classList.remove('open');$('save').onclick=()=>{data=[...document.querySelectorAll('.song-input')].map((x,i)=>({title:x.value.trim(),memo:document.querySelectorAll('.memo-input')[i].value}));localStorage.setItem(key,JSON.stringify(data));render();$('modal').classList.remove('open')};$('export').onclick=()=>{const rows=[...document.querySelectorAll('.song-input')].map((x,i)=>({title:x.value,memo:document.querySelectorAll('.memo-input')[i].value}));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(rows,null,2)],{type:'application/json'}));a.download='stage-os-setlist.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const v=JSON.parse(await f.text());if(!Array.isArray(v)||v.length<1||!v.every(x=>typeof x.title==='string'&&typeof x.memo==='string'))throw Error();data=v;localStorage.setItem(key,JSON.stringify(data));render();showEditor()}catch{alert('正しい設定JSONを選んでください')}e.target.value=''};if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
